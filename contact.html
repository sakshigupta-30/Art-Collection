<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Aria Sen</title>
  <meta name="description" content="Get in touch about the collection, loans, exhibitions or press enquiries.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-contact">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">ARTWORK COLLECTION</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="index.html">Artwork</a>
        <a href="about.html">About Us</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container contact-page fade-in">
    <header class="contact-heading">
      <p class="eyebrow">Correspondence</p>
      <h1 class="page-title">Contact</h1>
    </header>

    <section class="contact-details" aria-label="Contact details">
      <div>
        <p class="contact-label">Email us</p>
        <a class="contact-link" href="mailto:hello@artcollection.example">hello@artcollection.example</a>
      </div>
      <div>
        <p class="contact-label">LinkedIn</p>
        <a class="contact-link" href="https://www.linkedin.com/" target="_blank" rel="noreferrer">Follow the collection <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <div class="contact-layout">
      <figure class="contact-art" aria-label="Abstract gallery wall placeholder image">
        <img src="https://images.unsplash.com/photo-1577720580479-7d839d829c73?auto=format&fit=crop&w=1400&q=75" alt="Framed painting in a quiet gallery interior" width="1400" height="1050" loading="lazy" decoding="async">
        <figcaption>Collection study, 2026</figcaption>
      </figure>

      <div class="contact-form-panel">
        <div class="contact-intro">
          <p class="eyebrow">~</p>
          <h2>Give feedback</h2>
          <p>For exhibition enquiries, collaboration ideas, or a note about the collection, we would be glad to hear from you.</p>
        </div>
        <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Your Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="subject">What are you contacting us about?</label>
          <select id="subject" name="subject" required>
            <option value=""></option>
            <option>Collection enquiry</option>
            <option>Collaboration</option>
            <option>Feedback</option>
          </select>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="3" required></textarea>
        </div>

          <button type="submit" class="btn">Send message</button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/app.js" defer></script>
</body>
</html>

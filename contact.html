<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Aria Sen</title>
  <meta name="description" content="Get in touch about the collection, loans, exhibitions or press enquiries.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">ARTWORK COLLECTION</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="index.html">Artwork</a>
        <a href="about.html">About Us</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container fade-in">
    <div class="contact">
      <h1 class="page-title">Contact Us</h1>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Your Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="subject">What are you contacting us about?</label>
          <select id="subject" name="subject" required>
            <option value=""></option>
            <option>Request for Legal Services</option>
            <option>Website Feedback</option>
            <option>Something else</option>
          </select>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn">Submit</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Artwork Collection. All Rights Reserved.</p>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
